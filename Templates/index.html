<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiket Yazdır</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007bff">

    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input, button { width: 100%; padding: 15px; font-size: 1.1em; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; margin-top: 10px; }
        
        /* Sepet Alanı */
        #cart-section { margin-top: 30px; }
        #cart-items li {
            font-size: 1.1em;
            padding: 10px;
            background-color: #f4f4f4;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #cart-items li .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 0.8em;
            cursor: pointer;
            width: auto;
        }
        
        #print-all-button { background-color: #28a745; font-weight: bold; }
        #status { font-weight: bold; margin-top: 15px; }

        /* Upload Bölümü Stilleri */
        #upload-section {
            margin-top: 40px;
            border-top: 2px solid #ccc;
            padding-top: 20px;
        }
        #upload-section h3 {
            color: #333;
            margin-bottom: 15px;
        }
        #file-input {
            padding: 10px;
            font-size: 1em;
            cursor: pointer;
        }
        #upload-button {
            background-color: #17a2b8;
            margin-top: 10px;
        }
        #upload-status {
            font-weight: bold;
            margin-top: 10px;
        }

        /* Print Queue Stilleri */
        #print-queue-section {
            margin-top: 30px;
        }
        #print-queue-section h3 {
            color: #333;
        }
        #queue-items {
            list-style: none;
            padding: 0;
        }
        #queue-items li {
            font-size: 1em;
            padding: 12px;
            background-color: #e9ecef;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
        }
        #queue-items li .queue-info {
            flex: 1;
        }
        #queue-items li .queue-filename {
            font-weight: bold;
            color: #333;
        }
        #queue-items li .queue-status {
            font-size: 0.85em;
            color: #666;
        }
        #queue-items li .queue-actions {
            display: flex;
            gap: 5px;
        }
        #queue-items li .print-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 0.85em;
            cursor: pointer;
            border-radius: 3px;
            width: auto;
        }
        #queue-items li .remove-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 0.85em;
            cursor: pointer;
            border-radius: 3px;
            width: auto;
        }
        #print-all-queue-button {
            background-color: #28a745;
            font-weight: bold;
            margin-top: 10px;
        }

        /* Yönetim Bölümü Stilleri */
        #admin-section {
            margin-top: 40px;
            border-top: 2px solid #ccc;
            padding-top: 20px;
        }
        #admin-section summary {
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            color: #333;
        }
        .admin-forms {
            padding: 15px;
            background-color: #eee;
            border-radius: 5px;
            margin-top: 10px;
        }
        .admin-forms input { font-size: 1em; padding: 10px; margin-bottom: 10px; }
        .admin-forms button { font-size: 1em; padding: 10px; background-color: #5a6268; }
        #admin-status { font-weight: bold; }

    </style>
</head>
<body>
    <h2>Etiket Sistemi</h2>
    
    <div class="form-group">
        <label for="spice-select">Baharat Seçin:</label>
        <select id="spice-select">
            {% for baharat in baharat_listesi %}
                <option value="{{ baharat }}">{{ baharat }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="weight-select">Gramaj Seçin:</label>
        <select id="weight-select">
            {% for gramaj in gramaj_listesi %}
                <option value="{{ gramaj }}">{{ gramaj }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="page-count">Sayfa Sayısı:</label>
        <input type="number" id="page-count" value="1" min="1">
    </div>

    <div class="form-group">
        <label for="stt-tarihi">Son Tüketim Tarihi (Tüm Sepet İçin):</label>
        <input type="month" id="stt-tarihi"> </div>
    
    <button id="add-to-cart-button">SEPETE EKLE</button>
    
    <div id="cart-section">
        <h3>Yazdırma Sepeti</h3>
        <ul id="cart-items">
            </ul>
        <button id="print-all-button" style="display: none;">TÜMÜNÜ YAZDIR</button>
    </div>
    <p id="status"></p>

    <!-- DOSYA YÜKLEME BÖLÜMÜ -->
    <div id="upload-section">
        <h3>📤 Dosya Yükle ve Yazdır</h3>
        <div class="form-group">
            <label for="file-input">PDF veya Resim Dosyası Seçin:</label>
            <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg">
        </div>
        <button id="upload-button">DOSYA YÜKLE</button>
        <p id="upload-status"></p>
    </div>

    <!-- YAZDIRMA KUYRUĞU BÖLÜMÜ -->
    <div id="print-queue-section">
        <h3>🖨️ Yazdırma Kuyruğu</h3>
        <ul id="queue-items">
            <!-- Queue items will be dynamically added here -->
        </ul>
        <button id="print-all-queue-button" style="display: none;">TÜM KUYRUĞU YAZDIR</button>
    </div>

    <div id="admin-section">
        <details>
            <summary>Listeyi Düzenle (Yeni Öğe Ekle)</summary>
            <div class="admin-forms">
                <div class="form-group">
                    <label for="new-spice">Yeni Baharat Adı:</label>
                    <input type="text" id="new-spice" placeholder="örn: ZERDEÇAL">
                    <button id="add-spice-btn">Yeni Baharat Ekle</button>
                </div>
                <div class="form-group" style="margin-top: 20px;">
                    <label for="new-weight">Yeni Gramaj:</label>
                    <input type="text" id="new-weight" placeholder="örn: 750 GR">
                    <button id="add-weight-btn">Yeni Gramaj Ekle</button>
                </div>
                <p id="admin-status"></p>
            </div>
        </details>
    </div>

    <script>
        // Sepet Elemanları
        const spiceSelect = document.getElementById('spice-select');
        const weightSelect = document.getElementById('weight-select');
        const pageCountInput = document.getElementById('page-count');
        const tarihInput = document.getElementById('stt-tarihi'); // GÜNCELLENDİ: 'urt-tarihi' -> 'stt-tarihi'
        const addToCartBtn = document.getElementById('add-to-cart-button');
        const cartItemsList = document.getElementById('cart-items');
        const printAllBtn = document.getElementById('print-all-button');
        const statusEl = document.getElementById('status');
        
        let cart = []; // Sepet dizisi

        // YÖNETİM Elemanları
        const newSpiceInput = document.getElementById('new-spice');
        const addSpiceBtn = document.getElementById('add-spice-btn');
        const newWeightInput = document.getElementById('new-weight');
        const addWeightBtn = document.getElementById('add-weight-btn');
        const adminStatusEl = document.getElementById('admin-status');

        // DOSYA YÜKLEME Elemanları
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-button');
        const uploadStatusEl = document.getElementById('upload-status');
        const queueItemsList = document.getElementById('queue-items');
        const printAllQueueBtn = document.getElementById('print-all-queue-button');

        // GÜNCELLENDİ: Sayfa yüklendiğinde tarih alanını mevcut Ay/Yıl ile doldur
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            // Varsayılan STT'yi 2 yıl sonrası olarak ayarla
            today.setFullYear(today.getFullYear() + 2); 
            
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            tarihInput.value = `${yyyy}-${mm}`; // Format: "YYYY-MM"
            
            // Print queue'yu yükle
            loadPrintQueue();
        });

        // ---- SEPET FONKSİYONLARI ----

        addToCartBtn.addEventListener('click', () => {
            const spice = spiceSelect.value;
            const weight = weightSelect.value;
            const pages = parseInt(pageCountInput.value);

            if (pages < 1) {
                statusEl.textContent = "Hata: Sayfa sayısı en az 1 olmalı.";
                return;
            }
            const labelName = spice + "    " + weight; 
            cart.push({ label: labelName, pages: pages });
            renderCart();
            statusEl.textContent = `Sepete eklendi: ${labelName} (${pages} sayfa)`;
        });

        function renderCart() {
            cartItemsList.innerHTML = '';
            if (cart.length === 0) {
                printAllBtn.style.display = 'none';
                return;
            }
            cart.forEach((item, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${item.label} (${item.pages} sayfa)</span>
                    <button class="delete-btn" data-index="${index}">Sil</button>
                `;
                cartItemsList.appendChild(li);
            });
            printAllBtn.style.display = 'block';
        }

        cartItemsList.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                const indexToRemove = parseInt(e.target.dataset.index);
                const removedItem = cart.splice(indexToRemove, 1);
                renderCart();
                statusEl.textContent = `Silindi: ${removedItem[0].label}`;
            }
        });

        // "TÜMÜNÜ YAZDIR" Butonu (GÜNCELLENDİ)
        printAllBtn.addEventListener('click', () => {
            if (cart.length === 0) {
                statusEl.textContent = "Hata: Sepet boş.";
                return;
            }
            
            const date = tarihInput.value; // GÜNCELLENDİ: STT (YYYY-MM) bilgisini al
            if (!date) {
                statusEl.textContent = "Hata: Lütfen geçerli bir STT seçin.";
                return;
            }

            statusEl.textContent = 'Tüm sepet yazıcıya gönderiliyor...';
            
            fetch('/print-cart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // GÜNCELLENDİ: Sepetle birlikte tarihi de gönder
                body: JSON.stringify({ cart: cart, date: date }) 
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    statusEl.textContent = 'Başarılı: Tüm sepet yazıcıya gönderildi!';
                    cart = [];
                    renderCart();
                } else {
                    statusEl.textContent = `Hata: ${data.message}`;
                }
            })
            .catch(err => {
                statusEl.textContent = 'Hata: Sunucuya bağlanılamadı.';
            });
        });

        // ---- YÖNETİM FONKSİYONLARI (Aynı) ----

        addSpiceBtn.addEventListener('click', () => {
            const spiceName = newSpiceInput.value.trim().toUpperCase();
            if (!spiceName) {
                adminStatusEl.textContent = "Lütfen eklenecek baharat adını girin.";
                return;
            }
            
            adminStatusEl.textContent = "Kaydediliyor...";
            fetch('/add-spice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ spice_name: spiceName })
            })
            .then(res => res.json())
            .then(data => {
                adminStatusEl.textContent = data.message;
                if (data.success) {
                    setTimeout(() => location.reload(), 1000);
                }
            });
        });

        addWeightBtn.addEventListener('click', () => {
            const weightName = newWeightInput.value.trim().toUpperCase();
            if (!weightName) {
                adminStatusEl.textContent = "Lütfen eklenecek gramajı girin.";
                return;
            }
            
            adminStatusEl.textContent = "Kaydediliyor...";
            fetch('/add-weight', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ weight_name: weightName })
            })
            .then(res => res.json())
            .then(data => {
                adminStatusEl.textContent = data.message;
                if (data.success) {
                    setTimeout(() => location.reload(), 1000);
                }
            });
        });

        // ---- DOSYA YÜKLEME VE PRINT QUEUE FONKSİYONLARI ----

        // Dosya yükleme
        uploadBtn.addEventListener('click', () => {
            const file = fileInput.files[0];
            
            if (!file) {
                uploadStatusEl.textContent = "Lütfen bir dosya seçin.";
                uploadStatusEl.style.color = "#dc3545";
                return;
            }
            
            // Dosya tipi kontrolü
            const allowedTypes = ['application/pdf', 'image/png', 'image/jpeg', 'image/jpg'];
            if (!allowedTypes.includes(file.type)) {
                uploadStatusEl.textContent = "Hata: Sadece PDF, PNG, JPG dosyaları yükleyebilirsiniz.";
                uploadStatusEl.style.color = "#dc3545";
                return;
            }
            
            // Dosya boyutu kontrolü (10MB)
            const maxSize = 10 * 1024 * 1024;
            if (file.size > maxSize) {
                uploadStatusEl.textContent = "Hata: Dosya boyutu 10MB'dan büyük olamaz.";
                uploadStatusEl.style.color = "#dc3545";
                return;
            }
            
            uploadStatusEl.textContent = "Yükleniyor...";
            uploadStatusEl.style.color = "#007bff";
            
            const formData = new FormData();
            formData.append('file', file);
            
            fetch('/upload-file', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    uploadStatusEl.textContent = data.message;
                    uploadStatusEl.style.color = "#28a745";
                    fileInput.value = ''; // Dosya input'unu temizle
                    loadPrintQueue(); // Queue'yu yenile
                } else {
                    uploadStatusEl.textContent = `Hata: ${data.message}`;
                    uploadStatusEl.style.color = "#dc3545";
                }
            })
            .catch(err => {
                uploadStatusEl.textContent = "Hata: Sunucuya bağlanılamadı.";
                uploadStatusEl.style.color = "#dc3545";
            });
        });

        // Print queue'yu yükle
        function loadPrintQueue() {
            fetch('/get-print-queue')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    renderPrintQueue(data.queue);
                }
            })
            .catch(err => {
                console.error('Print queue yükleme hatası:', err);
            });
        }

        // Print queue'yu render et
        function renderPrintQueue(queue) {
            queueItemsList.innerHTML = '';
            
            if (queue.length === 0) {
                queueItemsList.innerHTML = '<li style="background-color: #f8f9fa; text-align: center;">Yazdırma kuyruğu boş</li>';
                printAllQueueBtn.style.display = 'none';
                return;
            }
            
            // Sadece pending ve printing durumundaki öğeleri göster
            const activeQueue = queue.filter(item => item.status === 'pending' || item.status === 'printing');
            
            if (activeQueue.length === 0) {
                queueItemsList.innerHTML = '<li style="background-color: #f8f9fa; text-align: center;">Yazdırma kuyruğu boş</li>';
                printAllQueueBtn.style.display = 'none';
                return;
            }
            
            activeQueue.forEach(item => {
                const li = document.createElement('li');
                
                const statusText = item.status === 'pending' ? '⏳ Bekliyor' : '🖨️ Yazdırılıyor';
                const statusColor = item.status === 'pending' ? '#666' : '#28a745';
                
                li.innerHTML = `
                    <div class="queue-info">
                        <div class="queue-filename">${item.original_filename}</div>
                        <div class="queue-status" style="color: ${statusColor}">${statusText}</div>
                    </div>
                    <div class="queue-actions">
                        ${item.status === 'pending' ? `<button class="print-btn" data-id="${item.id}">Yazdır</button>` : ''}
                        <button class="remove-btn" data-id="${item.id}">Sil</button>
                    </div>
                `;
                queueItemsList.appendChild(li);
            });
            
            printAllQueueBtn.style.display = 'block';
        }

        // Queue item'ları için event delegation
        queueItemsList.addEventListener('click', (e) => {
            const itemId = parseInt(e.target.dataset.id);
            
            if (e.target.classList.contains('print-btn')) {
                printQueueItem(itemId);
            } else if (e.target.classList.contains('remove-btn')) {
                removeFromQueue(itemId);
            }
        });

        // Tek bir queue item'ı yazdır
        function printQueueItem(itemId) {
            fetch(`/print-queue-item/${itemId}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    uploadStatusEl.textContent = data.message;
                    uploadStatusEl.style.color = "#28a745";
                    loadPrintQueue();
                } else {
                    uploadStatusEl.textContent = `Hata: ${data.message}`;
                    uploadStatusEl.style.color = "#dc3545";
                }
            })
            .catch(err => {
                uploadStatusEl.textContent = "Hata: Yazdırma başarısız.";
                uploadStatusEl.style.color = "#dc3545";
            });
        }

        // Queue'dan öğe sil
        function removeFromQueue(itemId) {
            if (!confirm('Bu dosyayı kuyruktan silmek istediğinizden emin misiniz?')) {
                return;
            }
            
            fetch(`/remove-from-queue/${itemId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    uploadStatusEl.textContent = data.message;
                    uploadStatusEl.style.color = "#28a745";
                    loadPrintQueue();
                } else {
                    uploadStatusEl.textContent = `Hata: ${data.message}`;
                    uploadStatusEl.style.color = "#dc3545";
                }
            })
            .catch(err => {
                uploadStatusEl.textContent = "Hata: Silme başarısız.";
                uploadStatusEl.style.color = "#dc3545";
            });
        }

        // Tüm kuyruğu yazdır
        printAllQueueBtn.addEventListener('click', () => {
            if (!confirm('Kuyruktaki tüm dosyaları yazdırmak istediğinizden emin misiniz?')) {
                return;
            }
            
            uploadStatusEl.textContent = "Tüm kuyruk yazdırılıyor...";
            uploadStatusEl.style.color = "#007bff";
            
            fetch('/print-all-queue', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    uploadStatusEl.textContent = data.message;
                    uploadStatusEl.style.color = "#28a745";
                    loadPrintQueue();
                } else {
                    uploadStatusEl.textContent = `Hata: ${data.message}`;
                    uploadStatusEl.style.color = "#dc3545";
                }
            })
            .catch(err => {
                uploadStatusEl.textContent = "Hata: Yazdırma başarısız.";
                uploadStatusEl.style.color = "#dc3545";
            });
        });

    </script>
</body>
</html>
