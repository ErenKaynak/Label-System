<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiket Yazdır</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007bff">

    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input, button { width: 100%; padding: 15px; font-size: 1.1em; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; margin-top: 10px; }
        
        /* Sepet Alanı */
        #cart-section { margin-top: 30px; }
        #cart-items li {
            font-size: 1.1em;
            padding: 10px;
            background-color: #f4f4f4;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #cart-items li .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 0.8em;
            cursor: pointer;
            width: auto;
        }
        
        #print-all-button { background-color: #28a745; font-weight: bold; }
        #status { font-weight: bold; margin-top: 15px; }

        /* Upload Section Styles */
        #upload-section {
            margin-top: 40px;
            border-top: 2px solid #ccc;
            padding-top: 20px;
        }
        #upload-queue-items li {
            font-size: 1em;
            padding: 10px;
            background-color: #e3f2fd;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 3px;
        }
        #upload-queue-items li .remove-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 0.8em;
            cursor: pointer;
            width: auto;
            border-radius: 3px;
        }
        #upload-status { font-weight: bold; }
        #file-upload { cursor: pointer; }

        /* Yönetim Bölümü Stilleri */
        #admin-section {
            margin-top: 40px;
            border-top: 2px solid #ccc;
            padding-top: 20px;
        }
        #admin-section summary {
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            color: #333;
        }
        .admin-forms {
            padding: 15px;
            background-color: #eee;
            border-radius: 5px;
            margin-top: 10px;
        }
        .admin-forms input { font-size: 1em; padding: 10px; margin-bottom: 10px; }
        .admin-forms button { font-size: 1em; padding: 10px; background-color: #5a6268; }
        #admin-status { font-weight: bold; }

    </style>
</head>
<body>
    <h2>Etiket Sistemi</h2>
    
    <div class="form-group">
        <label for="spice-select">Baharat Seçin:</label>
        <select id="spice-select">
            {% for baharat in baharat_listesi %}
                <option value="{{ baharat }}">{{ baharat }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="weight-select">Gramaj Seçin:</label>
        <select id="weight-select">
            {% for gramaj in gramaj_listesi %}
                <option value="{{ gramaj }}">{{ gramaj }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="page-count">Sayfa Sayısı:</label>
        <input type="number" id="page-count" value="1" min="1">
    </div>

    <div class="form-group">
        <label for="stt-tarihi">Son Tüketim Tarihi (Tüm Sepet İçin):</label>
        <input type="month" id="stt-tarihi"> </div>
    
    <button id="add-to-cart-button">SEPETE EKLE</button>
    
    <div id="cart-section">
        <h3>Yazdırma Sepeti</h3>
        <ul id="cart-items">
            </ul>
        <button id="print-all-button" style="display: none;">TÜMÜNÜ YAZDIR</button>
    </div>
    <p id="status"></p>

    <!-- NEW: File Upload Section -->
    <div id="upload-section" style="margin-top: 40px; border-top: 2px solid #ccc; padding-top: 20px;">
        <h3>📁 Resim/PDF Yükle ve Yazdır</h3>
        <div class="form-group">
            <label for="file-upload">Dosya Seç (Çoklu seçim desteklenir):</label>
            <input type="file" id="file-upload" multiple accept=".pdf,.png,.jpg,.jpeg,.gif,.bmp" 
                   style="padding: 10px; font-size: 1em;">
            <button id="upload-button" style="background-color: #17a2b8; margin-top: 10px;">YÜKLE</button>
        </div>
        
        <div id="upload-queue-section" style="margin-top: 20px;">
            <h4>Yazdırma Kuyruğu</h4>
            <ul id="upload-queue-items" style="list-style: none; padding: 0;">
            </ul>
            <button id="print-all-uploads-button" style="display: none; background-color: #28a745; font-weight: bold;">
                TÜMÜNÜ OTOMATIK YAZDIR
            </button>
        </div>
        <p id="upload-status" style="font-weight: bold; margin-top: 10px;"></p>
    </div>

    <div id="admin-section">
        <details>
            <summary>Listeyi Düzenle (Yeni Öğe Ekle)</summary>
            <div class="admin-forms">
                <div class="form-group">
                    <label for="new-spice">Yeni Baharat Adı:</label>
                    <input type="text" id="new-spice" placeholder="örn: ZERDEÇAL">
                    <button id="add-spice-btn">Yeni Baharat Ekle</button>
                </div>
                <div class="form-group" style="margin-top: 20px;">
                    <label for="new-weight">Yeni Gramaj:</label>
                    <input type="text" id="new-weight" placeholder="örn: 750 GR">
                    <button id="add-weight-btn">Yeni Gramaj Ekle</button>
                </div>
                <p id="admin-status"></p>
            </div>
        </details>
    </div>

    <script>
        // Sepet Elemanları
        const spiceSelect = document.getElementById('spice-select');
        const weightSelect = document.getElementById('weight-select');
        const pageCountInput = document.getElementById('page-count');
        const tarihInput = document.getElementById('stt-tarihi'); // GÜNCELLENDİ: 'urt-tarihi' -> 'stt-tarihi'
        const addToCartBtn = document.getElementById('add-to-cart-button');
        const cartItemsList = document.getElementById('cart-items');
        const printAllBtn = document.getElementById('print-all-button');
        const statusEl = document.getElementById('status');
        
        let cart = []; // Sepet dizisi

        // YÖNETİM Elemanları
        const newSpiceInput = document.getElementById('new-spice');
        const addSpiceBtn = document.getElementById('add-spice-btn');
        const newWeightInput = document.getElementById('new-weight');
        const addWeightBtn = document.getElementById('add-weight-btn');
        const adminStatusEl = document.getElementById('admin-status');

        // GÜNCELLENDİ: Sayfa yüklendiğinde tarih alanını mevcut Ay/Yıl ile doldur
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            // Varsayılan STT'yi 2 yıl sonrası olarak ayarla
            today.setFullYear(today.getFullYear() + 2); 
            
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            tarihInput.value = `${yyyy}-${mm}`; // Format: "YYYY-MM"
        });

        // ---- SEPET FONKSİYONLARI ----

        addToCartBtn.addEventListener('click', () => {
            const spice = spiceSelect.value;
            const weight = weightSelect.value;
            const pages = parseInt(pageCountInput.value);

            if (pages < 1) {
                statusEl.textContent = "Hata: Sayfa sayısı en az 1 olmalı.";
                return;
            }
            const labelName = spice + "    " + weight; 
            cart.push({ label: labelName, pages: pages });
            renderCart();
            statusEl.textContent = `Sepete eklendi: ${labelName} (${pages} sayfa)`;
        });

        function renderCart() {
            cartItemsList.innerHTML = '';
            if (cart.length === 0) {
                printAllBtn.style.display = 'none';
                return;
            }
            cart.forEach((item, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${item.label} (${item.pages} sayfa)</span>
                    <button class="delete-btn" data-index="${index}">Sil</button>
                `;
                cartItemsList.appendChild(li);
            });
            printAllBtn.style.display = 'block';
        }

        cartItemsList.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                const indexToRemove = parseInt(e.target.dataset.index);
                const removedItem = cart.splice(indexToRemove, 1);
                renderCart();
                statusEl.textContent = `Silindi: ${removedItem[0].label}`;
            }
        });

        // "TÜMÜNÜ YAZDIR" Butonu (GÜNCELLENDİ)
        printAllBtn.addEventListener('click', () => {
            if (cart.length === 0) {
                statusEl.textContent = "Hata: Sepet boş.";
                return;
            }
            
            const date = tarihInput.value; // GÜNCELLENDİ: STT (YYYY-MM) bilgisini al
            if (!date) {
                statusEl.textContent = "Hata: Lütfen geçerli bir STT seçin.";
                return;
            }

            statusEl.textContent = 'Tüm sepet yazıcıya gönderiliyor...';
            
            fetch('/print-cart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // GÜNCELLENDİ: Sepetle birlikte tarihi de gönder
                body: JSON.stringify({ cart: cart, date: date }) 
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    statusEl.textContent = 'Başarılı: Tüm sepet yazıcıya gönderildi!';
                    cart = [];
                    renderCart();
                } else {
                    statusEl.textContent = `Hata: ${data.message}`;
                }
            })
            .catch(err => {
                statusEl.textContent = 'Hata: Sunucuya bağlanılamadı.';
            });
        });

        // ---- YÖNETİM FONKSİYONLARI (Aynı) ----

        addSpiceBtn.addEventListener('click', () => {
            const spiceName = newSpiceInput.value.trim().toUpperCase();
            if (!spiceName) {
                adminStatusEl.textContent = "Lütfen eklenecek baharat adını girin.";
                return;
            }
            
            adminStatusEl.textContent = "Kaydediliyor...";
            fetch('/add-spice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ spice_name: spiceName })
            })
            .then(res => res.json())
            .then(data => {
                adminStatusEl.textContent = data.message;
                if (data.success) {
                    setTimeout(() => location.reload(), 1000);
                }
            });
        });

        addWeightBtn.addEventListener('click', () => {
            const weightName = newWeightInput.value.trim().toUpperCase();
            if (!weightName) {
                adminStatusEl.textContent = "Lütfen eklenecek gramajı girin.";
                return;
            }
            
            adminStatusEl.textContent = "Kaydediliyor...";
            fetch('/add-weight', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ weight_name: weightName })
            })
            .then(res => res.json())
            .then(data => {
                adminStatusEl.textContent = data.message;
                if (data.success) {
                    setTimeout(() => location.reload(), 1000);
                }
            });
        });

        // ---- FILE UPLOAD FONKSİYONLARI ----

        const fileUploadInput = document.getElementById('file-upload');
        const uploadButton = document.getElementById('upload-button');
        const uploadQueueList = document.getElementById('upload-queue-items');
        const printAllUploadsBtn = document.getElementById('print-all-uploads-button');
        const uploadStatusEl = document.getElementById('upload-status');

        // Load queue on page load
        function loadUploadQueue() {
            fetch('/get-upload-queue')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        renderUploadQueue(data.queue);
                    }
                })
                .catch(err => {
                    console.error('Error loading upload queue:', err);
                });
        }

        // Render upload queue
        function renderUploadQueue(queue) {
            uploadQueueList.innerHTML = '';
            if (!queue || queue.length === 0) {
                printAllUploadsBtn.style.display = 'none';
                return;
            }
            
            queue.forEach((item, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>📄 ${item.filename}</span>
                    <button class="remove-btn" data-index="${index}">Sil</button>
                `;
                uploadQueueList.appendChild(li);
            });
            printAllUploadsBtn.style.display = 'block';
        }

        // Upload files
        uploadButton.addEventListener('click', () => {
            const files = fileUploadInput.files;
            
            if (!files || files.length === 0) {
                uploadStatusEl.textContent = 'Lütfen en az bir dosya seçin.';
                uploadStatusEl.style.color = '#dc3545';
                return;
            }

            const formData = new FormData();
            for (let i = 0; i < files.length; i++) {
                formData.append('files[]', files[i]);
            }

            uploadStatusEl.textContent = 'Dosyalar yükleniyor...';
            uploadStatusEl.style.color = '#000';

            fetch('/upload-files', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    uploadStatusEl.textContent = data.message;
                    uploadStatusEl.style.color = '#28a745';
                    fileUploadInput.value = ''; // Clear file input
                    loadUploadQueue(); // Reload queue
                } else {
                    uploadStatusEl.textContent = `Hata: ${data.message}`;
                    uploadStatusEl.style.color = '#dc3545';
                }
            })
            .catch(err => {
                uploadStatusEl.textContent = 'Hata: Sunucuya bağlanılamadı.';
                uploadStatusEl.style.color = '#dc3545';
                console.error('Upload error:', err);
            });
        });

        // Remove from queue
        uploadQueueList.addEventListener('click', (e) => {
            if (e.target.classList.contains('remove-btn')) {
                const index = parseInt(e.target.dataset.index);
                
                fetch('/remove-from-queue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ index: index })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        uploadStatusEl.textContent = data.message;
                        uploadStatusEl.style.color = '#28a745';
                        loadUploadQueue(); // Reload queue
                    } else {
                        uploadStatusEl.textContent = `Hata: ${data.message}`;
                        uploadStatusEl.style.color = '#dc3545';
                    }
                })
                .catch(err => {
                    uploadStatusEl.textContent = 'Hata: Silme işlemi başarısız.';
                    uploadStatusEl.style.color = '#dc3545';
                });
            }
        });

        // Print all uploads automatically
        printAllUploadsBtn.addEventListener('click', () => {
            if (confirm('Tüm dosyalar otomatik olarak yazıcıya gönderilecek. Devam etmek istiyor musunuz?')) {
                uploadStatusEl.textContent = 'Dosyalar yazıcıya gönderiliyor...';
                uploadStatusEl.style.color = '#000';
                
                fetch('/print-all-uploads', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        uploadStatusEl.textContent = data.message;
                        uploadStatusEl.style.color = '#28a745';
                        loadUploadQueue(); // Reload queue (should be empty now)
                    } else {
                        uploadStatusEl.textContent = `Hata: ${data.message}`;
                        uploadStatusEl.style.color = '#dc3545';
                    }
                })
                .catch(err => {
                    uploadStatusEl.textContent = 'Hata: Yazdırma işlemi başarısız.';
                    uploadStatusEl.style.color = '#dc3545';
                    console.error('Print error:', err);
                });
            }
        });

        // Load upload queue on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadUploadQueue();
        });

    </script>
</body>
</html>
